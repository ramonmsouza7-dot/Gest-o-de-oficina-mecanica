<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Clientes — Oficina Mecânica</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><div th:replace="~{fragments/layout :: layout(~{::main})}"><main>
  <header class="page-header"><div><p class="eyebrow">Cadastro</p><h1>Clientes e veículos</h1></div></header>
  <section class="panel-grid">
    <article class="panel"><h2>Novo cliente</h2><form th:object="${novoCliente}" th:action="@{/clientes}" method="post" class="form-grid">
      <label>Nome<input th:field="*{nome}" required></label><label>CPF<input th:field="*{cpf}" required></label>
      <label>Telefone<input th:field="*{telefone}"></label><label>E-mail<input th:field="*{email}" type="email"></label>
      <button class="btn btn-primary" type="submit">Cadastrar cliente</button>
    </form></article>
  </section>
  <article class="panel"><h2>Clientes cadastrados</h2><div class="table-wrap"><table><thead><tr><th>Nome</th><th>CPF</th><th>Telefone</th><th>Veículos</th><th>Ações</th></tr></thead>
    <tbody><tr th:each="cliente : ${clientes}"><td th:text="${cliente.nome}"></td><td th:text="${cliente.cpf}"></td><td th:text="${cliente.telefone}"></td><td><span th:each="v : ${cliente.veiculos}" th:text="${v.placa + ' — ' + v.modelo + ' '} "></span></td>
      <td sec:authorize="hasRole('ADMINISTRADOR')"><form th:action="@{/clientes/{id}/excluir(id=${cliente.id})}" method="post"><button class="btn btn-danger">Excluir</button></form></td></tr></tbody></table></div></article>
  <article class="panel"><h2>Vincular veículo</h2><form th:action="@{/clientes/1/veiculos}" method="post" class="form-grid" id="veiculo-form" th:object="${novoVeiculo}">
    <label>Cliente<select id="clienteVeiculoSelect" required><option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.nome}"></option></select></label>
    <label>Marca<input th:field="*{marca}" required></label><label>Modelo<input th:field="*{modelo}" required></label>
    <label>Placa<input th:field="*{placa}" required></label><label>Ano<input th:field="*{ano}" type="number"></label>
    <button class="btn btn-secondary" type="submit">Cadastrar veículo</button>
  </form></article>
</main></div><script th:src="@{/js/app.js}"></script></body></html>
