<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel — Oficina Mecânica</title><link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: layout(~{::main})}">
<main>
  <header class="page-header"><div><p class="eyebrow">Visão geral</p><h1>Painel da Oficina</h1></div></header>
  <section class="stats-grid">
    <article class="stat-card"><span>Clientes</span><strong th:text="${totalClientes}">0</strong></article>
    <article class="stat-card"><span>Veículos</span><strong th:text="${totalVeiculos}">0</strong></article>
    <article class="stat-card"><span>Mecânicos</span><strong th:text="${totalMecanicos}">0</strong></article>
  </section>
  <section class="quick-actions">
    <a class="action-card" th:href="@{/ordens}"><span>01</span><div><h2>Ordens de Serviço</h2><p>Agendar, consultar e atualizar atendimentos.</p></div></a>
    <a class="action-card" th:href="@{/clientes}"><span>02</span><div><h2>Clientes e Veículos</h2><p>Gerenciar vínculos e dados cadastrais.</p></div></a>
  </section>
</main>
</div>
</body>
</html>
